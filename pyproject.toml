[project]
name = "codmon-huckleberry-sync"
version = "0.1.0"
description = "Sync daily nursery reports from Codmon (parents.codmon.com) into the Huckleberry baby tracking app."
requires-python = ">=3.14"
dependencies = [
    "huckleberry-api>=0.4.7",
    "playwright>=1.48",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.scripts]
codmon-sync = "codmon_sync.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codmon_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/codmon_sync"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]