[project]
name = "codmon-huckleberry-sync"
version = "0.1.0"
description = "Sync daily nursery reports from Codmon (parents.codmon.com) into the Huckleberry baby tracking app."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ngoc Do", email = "ngochust56@gmail.com" }]
keywords = ["codmon", "huckleberry", "nursery", "baby-tracker", "sync"]
requires-python = ">=3.14"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
dependencies = [
    "huckleberry-api>=0.4.7",
    "playwright>=1.48",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",
]

[project.urls]
Homepage = "https://github.com/ngoc-minh-do/codmon-huckleberry-sync"
Repository = "https://github.com/ngoc-minh-do/codmon-huckleberry-sync"
Issues = "https://github.com/ngoc-minh-do/codmon-huckleberry-sync/issues"
Changelog = "https://github.com/ngoc-minh-do/codmon-huckleberry-sync/blob/main/CHANGELOG.md"

[project.scripts]
codmon-sync = "codmon_sync.__main__:main"

[dependency-groups]
dev = [
    "ruff>=0.11",
    "pytest>=8",
    "pytest-asyncio>=0.25",
    "ty>=0.0.85",
    "prek>=0.5.5",
    "commitizen>=4.19.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codmon_sync"]

[tool.hatch.build.targets.sdist]
include = ["src/codmon_sync"]

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]
# Broad `except Exception` is intentional: per-event and best-effort paths must
# log and continue rather than abort a whole sync.
ignore = ["BLE001", "S112"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]

[tool.ty.rules]
# Pre-existing dynamic (Playwright) and dataclass-field-name false positives.
# Kept visible as warnings while typing adoption is incremental.
invalid-argument-type = "warn"
unresolved-attribute = "warn"

[tool.commitizen]
name = "cz_conventional_commits"
